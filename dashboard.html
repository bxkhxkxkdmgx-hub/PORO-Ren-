
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PORO Ren Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f3f6fd;color:#102a56}
header{background:#0751bc;color:white;padding:20px;display:flex;justify-content:space-between}
.logo{font-size:25px;font-weight:bold}
.logo span{color:#ff9b35}
.container{max-width:600px;margin:auto;padding:15px}
.card{background:white;padding:20px;border-radius:15px;margin-bottom:18px;box-shadow:0 4px 15px #0001}
.welcome{background:linear-gradient(135deg,#06235a,#0868ed);color:white;padding:25px;border-radius:17px;margin-bottom:20px}
.welcome h2{margin-bottom:10px}
.loan{background:linear-gradient(135deg,#06235a,#0868ed);color:white;padding:20px;border-radius:18px;margin-bottom:20px}
.details{background:white;color:#102a56;padding:15px;border-radius:12px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:15px 0}
.details h3{font-size:16px}
.details p{font-size:12px;margin-bottom:8px}
button{cursor:pointer}
.apply{width:100%;padding:15px;background:#ff9b35;border:0;border-radius:10px;font-weight:bold;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:white;padding:18px 5px;text-align:center;border-radius:12px;text-decoration:none;color:#102a56;font-size:13px}
.item span{display:block;font-size:25px;margin-bottom:8px}
nav{position:fixed;bottom:0;left:0;width:100%;background:white;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 0;border-top:1px solid #ddd}
nav a{text-decoration:none;text-align:center;color:#0751bc;font-size:13px}
nav span{display:block;font-size:22px}
footer{text-align:center;padding:20px 10px 90px;color:#777}
</style>
</head>
<body>

<header>
<div class="logo">PORO <span>Ren</span></div>
<button onclick="logout()">Logout</button>
</header>

<div class="container">

<div class="welcome">
<h2 id="welcome">স্বাগতম!</h2>
<p id="email"></p>
</div>

<div class="loan">
<h2>💰 আমার ঋণ সার্ভিস</h2>
<p style="margin-top:8px">ঋণের আবেদন ও তথ্য</p>

<div class="details">
<div><p>সর্বোচ্চ ঋণ</p><h3>৳৩০,০০০</h3></div>
<div><p>সুদের হার</p><h3>শর্ত অনুযায়ী</h3></div>
<div><p>মেয়াদ</p><h3>৬-২৪ মাস</h3></div>
</div>

<button class="apply" onclick="location.href='apply.html'">✏️ ঋণের আবেদন</button>
</div>

<div class="card">
<h3>📄 আমার আবেদন</h3>
<p style="margin-top:15px">আপনার আবেদন এখানে দেখতে পারবেন।</p>
<button onclick="location.href='applications.html'" style="margin-top:15px;padding:12px;background:#0751bc;color:white;border:0;border-radius:8px">আবেদন দেখুন →</button>
</div>

<div class="grid">
<a class="item" href="profile.html"><span>👤</span>প্রোফাইল</a>
<a class="item" href="security.html"><span>🛡️</span>নিরাপত্তা</a>
<a class="item" href="help.html"><span>🎧</span>সাহায্য</a>
</div>

</div>

<nav>
<a href="dashboard.html"><span>🏠</span>হোম</a>
<a href="apply.html"><span>📝</span>আবেদন</a>
<a href="applications.html"><span>📄</span>আবেদনসমূহ</a>
<a href="profile.html"><span>⚙️</span>প্রোফাইল</a>
</nav>

<footer>© 2026 PORO Ren</footer>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig={
apiKey:"AIzaSyAzlIrVn9FrsBDNNDoCvRCU1bHxSNtEzhY",
authDomain:"project-be074433-8fce-4dc9-bd7.firebaseapp.com",
projectId:"project-be074433-8fce-4dc9-bd7",
storageBucket:"project-be074433-8fce-4dc9-bd7.firebasestorage.app",
messagingSenderId:"678442800678",
appId:"1:678442800678:web:dc364fe500d9c3e37af8e7"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

onAuthStateChanged(auth,user=>{
if(!user){location.replace("index.html");return;}
document.getElementById("welcome").textContent="স্বাগতম, "+(user.displayName||"User");
document.getElementById("email").textContent=user.email||"";
});

window.logout=async()=>{
await signOut(auth);
location.replace("index.html");
};
</script>
</body>
</html>
