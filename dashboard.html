
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PORO Ren Dashboard</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f1f5fb;
  color:#17243b;
}

header{
  background:#102a56;
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:bold;
  color:#ff9b35;
}

button{
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.logout{
  background:#ff9b35;
  color:#102a56;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:25px 15px;
}

.welcome{
  background:linear-gradient(135deg,#102a56,#2468df);
  color:white;
  padding:30px;
  border-radius:15px;
  margin-bottom:25px;
}

.welcome h1{
  font-size:27px;
  margin-bottom:12px;
}

.welcome p{
  line-height:1.7;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 4px 15px #00000008;
}

.card h3{
  color:#2468df;
  margin-bottom:12px;
}

.profile{
  background:white;
  padding:25px;
  border-radius:12px;
  margin-top:25px;
}

.profile h2{
  margin-bottom:20px;
}

.info{
  background:#f1f5fb;
  padding:14px;
  border-radius:8px;
  margin-bottom:12px;
  overflow-wrap:anywhere;
}

footer{
  text-align:center;
  padding:25px;
  color:#777;
}

#loading{
  text-align:center;
  padding:50px;
  font-size:18px;
}

#app{
  display:none;
}
</style>
</head>

<body>

<header>
  <div class="logo">PORO Ren</div>
  <button class="logout" id="logoutBtn">Logout</button>
</header>

<div id="loading">
  Dashboard Loading...
</div>

<div id="app">

  <div class="container">

    <section class="welcome">
      <h1 id="welcomeName">Welcome!</h1>
      <p>আপনার PORO Ren Dashboard-এ স্বাগতম।</p>
    </section>

    <section class="grid">

      <div class="card">
        <h3>👤 My Account</h3>
        <p>আপনার ব্যক্তিগত অ্যাকাউন্ট।</p>
      </div>

      <div class="card">
        <h3>🔐 Security</h3>
        <p>Firebase Authentication দ্বারা সুরক্ষিত।</p>
      </div>

      <div class="card">
        <h3>📱 Dashboard</h3>
        <p>আপনার Dashboard সফলভাবে চালু হয়েছে।</p>
      </div>

    </section>

    <section class="profile">

      <h2>My Profile</h2>

      <div class="info">
        <strong>Name:</strong>
        <span id="userName"></span>
      </div>

      <div class="info">
        <strong>Email:</strong>
        <span id="userEmail"></span>
      </div>

      <div class="info">
        <strong>User ID:</strong>
        <span id="userId"></span>
      </div>

      <div class="info">
        <strong>Status:</strong> Active
      </div>

    </section>

  </div>

</div>

<footer>
  © 2026 PORO Ren
</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzlIrVn9FrsBDNNDoCvRCU1bHxSNtEzhY",
  authDomain: "project-be074433-8fce-4dc9-bd7.firebaseapp.com",
  projectId: "project-be074433-8fce-4dc9-bd7",
  storageBucket: "project-be074433-8fce-4dc9-bd7.firebasestorage.app",
  messagingSenderId: "678442800678",
  appId: "1:678442800678:web:dc364fe500d9c3e37af8e7",
  measurementId: "G-9YXCGNCKZZ"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);

let authChecked = false;

onAuthStateChanged(auth, (user) => {

  if(authChecked) return;
  authChecked = true;

  if(!user){

    window.location.replace("index.html");
    return;

  }

  document.getElementById("welcomeName").textContent =
    "Welcome, " + (user.displayName || "User") + "!";

  document.getElementById("userName").textContent =
    user.displayName || "User";

  document.getElementById("userEmail").textContent =
    user.email || "Not Available";

  document.getElementById("userId").textContent =
    user.uid;

  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";

});

document.getElementById("logoutBtn")
.addEventListener("click", async () => {

  try{

    await signOut(auth);
    window.location.replace("index.html");

  }catch(error){

    alert("Logout Error: " + error.message);

  }

});

</script>

</body>
</html>
