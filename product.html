
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bedding House - Products</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
 font-family:Arial,sans-serif;
 background:#f3f7f3;
 color:#173b27;
 padding-bottom:75px
}
header{
 background:#087b48;
 color:white;
 padding:15px;
 text-align:center;
 font-size:24px;
 font-weight:bold
}
.search{
 display:flex;
 gap:8px;
 padding:15px
}
.search input{
 flex:1;
 padding:12px;
 border:1px solid #ddd;
 border-radius:10px
}
.search button{
 background:#087b48;
 color:white;
 border:0;
 padding:12px;
 border-radius:10px
}
.categories{
 display:flex;
 gap:10px;
 overflow:auto;
 padding:0 15px 15px
}
.categories button{
 border:1px solid #087b48;
 background:white;
 padding:10px 15px;
 border-radius:20px;
 white-space:nowrap
}
.categories button.active{
 background:#087b48;
 color:white
}
h2{padding:15px;font-size:21px}
.products{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
 padding:12px
}
.product{
 background:white;
 border-radius:14px;
 overflow:hidden;
 box-shadow:0 2px 7px #ddd
}
.product img{
 width:100%;
 height:160px;
 object-fit:cover
}
.info{padding:10px}
.info h3{font-size:15px;margin-bottom:8px}
.price{
 color:#087b48;
 font-size:18px;
 font-weight:bold
}
.info button{
 width:100%;
 margin-top:10px;
 padding:10px;
 border:0;
 background:#087b48;
 color:white;
 border-radius:8px
}
.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#087b48;
 display:flex;
 justify-content:space-around;
 padding:12px 5px
}
.bottom a{
 color:white;
 text-decoration:none;
 text-align:center;
 font-size:13px
}
.bottom span{
 display:block;
 font-size:21px
}
</style>
</head>

<body>

<header>🛏️ BEDDING HOUSE</header>

<div class="search">
<input id="search" placeholder="পণ্য খুঁজুন...">
<button onclick="searchProduct()">🔍</button>
</div>

<div class="categories">
<button class="active" onclick="filterCategory('all',this)">সব পণ্য</button>
<button onclick="filterCategory('বেডশিট',this)">বেডশিট</button>
<button onclick="filterCategory('বালিশ',this)">বালিশ</button>
<button onclick="filterCategory('কম্বল',this)">কম্বল</button>
<button onclick="filterCategory('বেড কভার',this)">বেড কভার</button>
</div>

<h2>🛍️ আমাদের সকল পণ্য</h2>

<div class="products" id="productList">

<div class="product" data-name="সুন্দর বেডশিট" data-category="বেডশিট">
<img src="https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=500" alt="বেডশিট">
<div class="info">
<h3>সুন্দর বেডশিট</h3>
<p class="price">৳ ১,২৫০</p>
<button onclick="addCart('সুন্দর বেডশিট',1250)">🛒 কার্টে যোগ করুন</button>
</div>
</div>

<div class="product" data-name="আরামদায়ক বালিশ" data-category="বালিশ">
<img src="https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=500" alt="বালিশ">
<div class="info">
<h3>আরামদায়ক বালিশ</h3>
<p class="price">৳ ৬৫০</p>
<button onclick="addCart('আরামদায়ক বালিশ',650)">🛒 কার্টে যোগ করুন</button>
</div>
</div>

<div class="product" data-name="প্রিমিয়াম কম্বল" data-category="কম্বল">
<img src="https://images.unsplash.com/photo-1616594039964-ae9021a400a0?w=500" alt="কম্বল">
<div class="info">
<h3>প্রিমিয়াম কম্বল</h3>
<p class="price">৳ ১,৫০০</p>
<button onclick="addCart('প্রিমিয়াম কম্বল',1500)">🛒 কার্টে যোগ করুন</button>
</div>
</div>

<div class="product" data-name="বেড কভার" data-category="বেড কভার">
<img src="https://images.unsplash.com/photo-1631679706909-1844bbd07221?w=500" alt="বেড কভার">
<div class="info">
<h3>বেড কভার</h3>
<p class="price">৳ ৯৫০</p>
<button onclick="addCart('বেড কভার',950)">🛒 কার্টে যোগ করুন</button>
</div>
</div>

</div>

<div class="bottom">
<a href="index.html"><span>🏠</span>হোম</a>
<a href="product.html"><span>🛍️</span>পণ্য</a>
<a href="cart.html"><span>🛒</span>কার্ট</a>
<a href="login.html"><span>👤</span>আমার</a>
</div>

<script>
let cart=JSON.parse(localStorage.getItem("beddingCart")||"[]");

function addCart(name,price){
 cart.push({name:name,price:price});
 localStorage.setItem("beddingCart",JSON.stringify(cart));
 alert(name+" কার্টে যোগ হয়েছে!");
}

function searchProduct(){
 let value=document.getElementById("search").value.toLowerCase();
 document.querySelectorAll(".product").forEach(p=>{
  p.style.display=p.dataset.name.toLowerCase().includes(value)?"block":"none";
 });
}

function filterCategory(category,button){
 document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
 button.classList.add("active");

 document.querySelectorAll(".product").forEach(p=>{
  p.style.display=(category==="all"||p.dataset.category===category)?"block":"none";
 });
}
</script>

</body>
</html>
